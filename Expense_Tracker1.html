<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <link rel="stylesheet" href="Expense_Tracker1.css" />
    <title>Expense Tracker</title>
</head>
<body>
    <div class="header">
        <h2>Expense Tracker</h2>
        <div id="functions" class="buttons">
            <button id="home-button">Home</button>
            <button id="customer-support-button">Customer Support</button>
            <button id="logout-button">Logout</button>
        </div>
        <div id="function" class="button">
            <button id="list" class="Primary-button"> History</button>
        </div>
    </div>

    <div class="container">
        <h4>Your Balance</h4>
        <h1 id="balance">Rs. 0.00</h1>

        <div class="inc-exp-container">
            <div>
                <h4>Income</h4>
                <p id="money-plus" class="money plus">+Rs. 0.00</p>
            </div>
            <div>
                <h4>Expense</h4>
                <p id="money-minus" class="money minus">-Rs. 0.00</p>
            </div>
        </div>
        </ul>

        <h3>Add new transaction</h3>
       <!-- ... other HTML code ... -->
<form id="form">
    <div class="form-control">
        <label for="text" style="font-weight: bold;">Data</label>
        <input type="text" id="text" placeholder="Enter Where You Spend Money-->" />
    </div>

    <div class="form-control">
        <label for="categories" style="font-weight: bold;">Select Category</label>
        <select id="categories">
            <option value="food">Food</option>
            <option value="clothing">Clothing</option>
            <option value="entertainment">Entertainment</option>
            <option value="utilities">Utilities</option>
            <!-- Add more options as needed -->
        </select>
    </div>

    <!-- Added Date Input -->
    <div class="form-control">
        <label for="date" style="font-weight: bold;">Date</label>
        <input type="date" id="date" />
    </div>
    <!-- End of Added Date Input -->

    <div class="form-control">
        <label for="amount" style="font-weight: bold;">Amount <br /></label>
        <input type="number" id="amount" placeholder="Enter amount... (negative - expense, positive - income)" />
    </div>
    <button class="btn">Add transaction</button>
</form>
<!-- ... other HTML code ... -->


    <!-- Added History Section -->
    <div class="header">
        <div id="function" class="button">
            <button id="history-button" onclick="toggledropdown()" class="Primary-button">History</button>
        </div>
    </div>

    <div class="container">
        <h3 id="history-title">Transaction History</h3>
        <div id="history-section" class="list">
            <!-- History transactions will be displayed here -->
        </div>
    </div>
    <!-- End of Added History Section -->

    <script src="Expense_Tracker1.js"></script>
    <script src="Expense_Tracker.js"></script>
    <script>
        document.getElementById("logout-button").addEventListener("click", function () {
            window.open("Expense_Tracker_Login1.html", "_blank");
        });
        document.getElementById("home-button").addEventListener("click", function () {
            window.open("Expense_Tracker1.html", "_blank");
        });
    </script>
</body>
</html>
